<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" >
    <meta name="viewport" content="width=device-width, initial-scale=1.0" >
    <title>Atla | Branding Studio</title>
    <meta name="description" content="Atla is a strategy-led branding studio for ambitious companies across the US and Latin America.">
    <meta property="og:title" content="Atla | Branding Studio">
    <meta property="og:description" content="Strategy, identity, and creative direction for companies that take their brand seriously.">
    <meta property="og:type" content="website">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" >
    <!-- Fonts are self-hosted (src/styles/site.css @font-face, font-display: swap). The display face and the
         body face's Latin file are preloaded: the LCP on text pages is body copy, and a late Libre Franklin
         swap moved LCP to the swap (5 s on /services/). Italic and latin-ext are found by the CSS when used.
         Images come from Sanity's CDN. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/ABCSyntVariable-subset.woff2" crossorigin>
    <link rel="preload" as="font" type="font/woff2" href="/fonts/LibreFranklin-latin.woff2" crossorigin>
    <link rel="preconnect" href="https://cdn.sanity.io">
    <style>
      /* On the routes whose prerender is the phone layout (the wall, /hospitality: script/build.ts adds
         data-prerender-gate), wider screens keep it unpainted until hydration has set the real layout
         (App.tsx HydrationDone). Every other route paints its prerender at once. The animation is the
         failsafe if the bundle never runs. */
      @media (min-width: 768px) {
        #root[data-prerender-gate] {
          visibility: hidden;
          animation: atla-prerender-reveal 0s linear 3s forwards;
        }
      }
      @keyframes atla-prerender-reveal {
        to { visibility: visible; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
