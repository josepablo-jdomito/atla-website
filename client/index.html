<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" >
    <meta name="viewport" content="width=device-width, initial-scale=1.0" >
    <title>Atla — Branding Studio</title>
    <meta name="description" content="Atla is a strategy-led branding studio for ambitious companies across the US and Latin America.">
    <meta property="og:title" content="Atla — Branding Studio">
    <meta property="og:description" content="Strategy, identity, and creative direction for companies that take their brand seriously.">
    <meta property="og:type" content="website">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" >
    <meta name="color-scheme" content="light dark">
    <!-- Restores the visitor's light/dark choice before the first paint (navbar toggle). External, not
         inline: the CSP allows no inline script. Without a stored choice the system decides (site.css). -->
    <script src="/theme-init.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Fonts never block the first paint: preloaded, applied by /font-loader.js once they arrive
         (media="print" until then), with swap so text shows at once in the fallback face. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap">
    <link id="atla-fonts-stylesheet" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" media="print">
    <script src="/font-loader.js" defer></script>
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap"></noscript>
    <style>
      /* Prerendered markup is the mobile layout. On wider screens keep it
         unpainted until React commits the real layout (App.tsx PrerenderReveal).
         The animation is the failsafe if the bundle never runs. */
      @media (min-width: 768px) {
        #root[data-prerender-gate] {
          visibility: hidden;
          animation: atla-prerender-reveal 0s linear 3s forwards;
        }
      }
      @keyframes atla-prerender-reveal {
        to { visibility: visible; }
      }
    </style>
    <!-- GA4. Loader only: the CSP in vercel.json has no 'unsafe-inline' for
         script-src, so the bootstrap lives in client/src/lib/ga.ts instead of
         an inline block here. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-X4ZD7PGXE3"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
